<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tennis-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ball-gradient">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Tennis Ball (same yellow as badminton cork) -->
  <circle cx="32" cy="18" r="7" fill="url(#ball-gradient)"/>
  <path d="M27 16 Q32 18 37 16" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M27 20 Q32 18 37 20" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.6"/>
  
  <!-- Racket -->
  <ellipse cx="32" cy="46" rx="13" ry="15" fill="none" stroke="url(#tennis-gradient)" stroke-width="3.5"/>
  <line x1="32" y1="61" x2="32" y2="64" stroke="url(#tennis-gradient)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- String pattern -->
  <line x1="24" y1="42" x2="40" y2="42" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="46" x2="40" y2="46" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="50" x2="40" y2="50" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
  <line x1="26" y1="38" x2="26" y2="54" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
  <line x1="32" y1="38" x2="32" y2="54" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="38" x2="38" y2="54" stroke="url(#tennis-gradient)" stroke-width="0.8" opacity="0.3"/>
</svg>
