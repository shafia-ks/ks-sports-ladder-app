<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badminton-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shuttlecock-gradient">
      <stop offset="0%" style="stop-color:#FEF3C7;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FCD34D;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Shuttlecock (realistic with radiant yellow) -->
  <!-- Cork base -->
  <circle cx="32" cy="16" r="4" fill="url(#shuttlecock-gradient)"/>
  
  <!-- Feathers/skirt -->
  <path d="M28 16 L24 32 L28 30 Z" fill="white" stroke="#E5E7EB" stroke-width="0.5" opacity="0.95"/>
  <path d="M30 16 L28 32 L30 30 Z" fill="white" stroke="#E5E7EB" stroke-width="0.5" opacity="0.95"/>
  <path d="M32 16 L32 32 Z" fill="white" stroke="#E5E7EB" stroke-width="1" opacity="0.95"/>
  <path d="M34 16 L36 32 L34 30 Z" fill="white" stroke="#E5E7EB" stroke-width="0.5" opacity="0.95"/>
  <path d="M36 16 L40 32 L36 30 Z" fill="white" stroke="#E5E7EB" stroke-width="0.5" opacity="0.95"/>
  
  <!-- Racket -->
  <ellipse cx="32" cy="48" rx="12" ry="14" fill="none" stroke="url(#badminton-gradient)" stroke-width="3"/>
  <line x1="32" y1="62" x2="32" y2="64" stroke="url(#badminton-gradient)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- String pattern -->
  <line x1="26" y1="44" x2="38" y2="44" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="26" y1="48" x2="38" y2="48" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="26" y1="52" x2="38" y2="52" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="28" y1="40" x2="28" y2="56" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="32" y1="40" x2="32" y2="56" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
  <line x1="36" y1="40" x2="36" y2="56" stroke="url(#badminton-gradient)" stroke-width="0.8" opacity="0.4"/>
</svg>
