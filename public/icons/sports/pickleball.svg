<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pickleball-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pickle-ball-gradient">
      <stop offset="0%" style="stop-color:#FED7AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Pickleball with holes -->
  <circle cx="42" cy="20" r="6" fill="url(#pickle-ball-gradient)"/>
  <circle cx="40" cy="18" r="1.2" fill="#C2410C" opacity="0.6"/>
  <circle cx="44" cy="18" r="1.2" fill="#C2410C" opacity="0.6"/>
  <circle cx="42" cy="22" r="1.2" fill="#C2410C" opacity="0.6"/>
  
  <!-- Paddle (rounded rectangle) -->
  <rect x="18" y="38" width="20" height="20" rx="10" fill="none" stroke="url(#pickleball-gradient)" stroke-width="3.5"/>
  <line x1="28" y1="58" x2="28" y2="64" stroke="url(#pickleball-gradient)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Paddle texture -->
  <circle cx="24" cy="44" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="28" cy="44" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="32" cy="44" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="24" cy="48" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="28" cy="48" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="32" cy="48" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="24" cy="52" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="28" cy="52" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
  <circle cx="32" cy="52" r="1" fill="url(#pickleball-gradient)" opacity="0.3"/>
</svg>
