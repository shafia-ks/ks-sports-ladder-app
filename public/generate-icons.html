<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .icon-preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    canvas {
      border: 1px solid #ddd;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>Click the buttons below to download the required PWA icons.</p>
  
  <div class="icon-preview">
    <div>
      <p><strong>192x192 Icon</strong></p>
      <canvas id="canvas192" width="192" height="192"></canvas>
      <br>
      <button onclick="download192()">Download 192x192</button>
    </div>
    <div>
      <p><strong>512x512 Icon</strong></p>
      <canvas id="canvas512" width="512" height="512"></canvas>
      <br>
      <button onclick="download512()">Download 512x512</button>
    </div>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      
      // Background
      ctx.fillStyle = '#2563eb';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.15);
      ctx.fill();
      
      // Trophy and ladder icon
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏆', size / 2, size / 2);
    }

    function download192() {
      const canvas = document.getElementById('canvas192');
      const link = document.createElement('a');
      link.download = 'icon-192x192.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function download512() {
      const canvas = document.getElementById('canvas512');
      const link = document.createElement('a');
      link.download = 'icon-512x512.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    // Draw icons on page load
    window.onload = function() {
      drawIcon(document.getElementById('canvas192'));
      drawIcon(document.getElementById('canvas512'));
    };
  </script>
</body>
</html>
