<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - KS Sports Ladder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1e293b;
      padding: 1rem;
    }
    
    .container {
      background: white;
      border-radius: 1rem;
      padding: 3rem 2rem;
      max-width: 28rem;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .icon {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1.5rem;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-center;
    }
    
    .icon svg {
      width: 2.5rem;
      height: 2.5rem;
      color: #dc2626;
    }
    
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #1e293b;
    }
    
    p {
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-direction: column;
    }
    
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button.secondary {
      background: #f1f5f9;
      color: #475569;
    }
    
    button.secondary:hover {
      background: #e2e8f0;
    }
    
    .status {
      margin-top: 1.5rem;
      padding: 0.75rem;
      background: #fef3c7;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      color: #92400e;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    @media (min-width: 640px) {
      .button-group {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>
    
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
    
    <div class="button-group">
      <button onclick="retryConnection()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Retry Connection
      </button>
      <button class="secondary" onclick="goHome()">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Go Home
      </button>
    </div>
    
    <div id="status" class="status">
      Checking connection...
    </div>
  </div>

  <script>
    function showStatus(message) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.add('show');
      setTimeout(() => {
        status.classList.remove('show');
      }, 3000);
    }

    function retryConnection() {
      showStatus('Checking connection...');
      
      fetch('/', { method: 'HEAD', cache: 'no-cache' })
        .then(() => {
          showStatus('Connection restored! Redirecting...');
          setTimeout(() => {
            window.location.reload();
          }, 500);
        })
        .catch(() => {
          showStatus('Still offline. Please check your connection.');
        });
    }

    function goHome() {
      window.location.href = '/';
    }

    // Auto-check connection every 10 seconds
    setInterval(() => {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 10000);

    // Listen for online event
    window.addEventListener('online', () => {
      showStatus('Connection restored! Redirecting...');
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });
  </script>
</body>
</html>
