name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  typecheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit

      - name: Upload Jest junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: junit.xml
          if-no-files-found: ignore

  e2e-health:
    runs-on: ubuntu-latest
    needs: [typecheck-and-unit]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NODE_ENV: production
    steps:
      - name: Check if secrets are configured
        id: check-secrets
        run: |
          if [[ -z "${{ secrets.SUPABASE_URL }}" ]] || [[ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]] || [[ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Checkout
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check-secrets.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.check-secrets.outputs.skip != 'true'
        run: npx playwright install --with-deps

      - name: Build Next.js app
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm run build

      - name: Start Next.js server
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          nohup npm start --silent &
          echo $! > .next-server-pid
      
      - name: Wait for server to be ready
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          npx wait-on --timeout 60000 http://localhost:3000

      - name: Run health e2e test
        if: steps.check-secrets.outputs.skip != 'true'
        run: npx playwright test e2e/health.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e
          path: junit-e2e.xml
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          kill $(cat .next-server-pid) || true
